<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091410"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Meter Gauge Arc (Representing 200 kWh Ceiling) -->
  <path d="M 126 310 A 150 150 0 1 1 386 310" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round"/>
  <!-- Safe Zone Arc in Emerald -->
  <path d="M 126 310 A 150 150 0 0 1 346 175" fill="none" stroke="url(#glow)" stroke-width="26" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- Warning Segment -->
  <path d="M 352 182 A 150 150 0 0 1 386 310" fill="none" stroke="#f59e0b" stroke-width="26" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- Center Energy Bolt -->
  <path d="M 276 156 L 196 280 L 254 280 L 236 376 L 326 244 L 268 244 Z" fill="url(#boltGrad)" filter="url(#shadow)"/>

  <!-- Digital Badge: 200 Protected -->
  <rect x="166" y="380" width="180" height="48" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="256" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="2">200 kWh</text>
</svg>
